<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contatti Clienti</title>
<meta name="description" content="Foglio contatti clienti: chi chiamare, quando, perché e con che esito. I dati restano sul dispositivo.">
<meta name="theme-color" content="#1d5fd1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Contatti">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #f2f5fa;
    --sheet: #ffffff;
    --ink: #17202f;
    --ink-2: #5a6578;
    --line: #d9e0eb;
    --head: #e9eff8;
    --head-ink: #34445e;
    --day: #f5f8fd;
    --accent: #1d5fd1;
    --accent-soft: #e3ecfc;
    --accent-ink: #ffffff;
    --focus: #1d5fd1;
    --today: #eaf1fe;
    --late: #fdecea;
    --late-ink: #b3261e;
    --row-hover: #f5f8fd;
    --shadow: 0 1px 2px rgba(16,32,64,.06), 0 4px 16px rgba(16,32,64,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e131d;
      --sheet: #151b27;
      --ink: #e6ebf3;
      --ink-2: #97a3b6;
      --line: #263045;
      --head: #1b2333;
      --head-ink: #c4cfdf;
      --day: #18202e;
      --accent: #5b9bff;
      --accent-soft: #1d2d4d;
      --accent-ink: #0a1222;
      --focus: #5b9bff;
      --today: #172540;
      --late: #3b1d1f;
      --late-ink: #ff8a80;
      --row-hover: #1b2333;
      --shadow: 0 1px 2px rgba(0,0,0,.4);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior: none;
  }

  /* ---------- Toolbar ---------- */
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
    padding: 12px 16px;
  }
  h1 { font-size: 20px; margin: 0 8px 0 0; letter-spacing: -.01em; white-space: nowrap; }
  .grow { flex: 1 1 auto; }
  button, .btn {
    font: inherit; font-size: 15px; font-weight: 600;
    min-height: 44px; padding: 0 16px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--sheet); color: var(--ink);
    display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer; white-space: nowrap;
    transition: transform .08s ease, background .15s ease;
  }
  button:active, .btn:active { transform: scale(.97); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .search {
    flex: 1 1 220px; max-width: 360px;
    min-height: 44px; padding: 0 14px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--sheet); color: var(--ink); font: inherit; font-size: 16px;
  }
  .search:focus, .order select:focus { outline: 2px solid var(--focus); outline-offset: -1px; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 0 16px 10px; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    min-height: 36px; padding: 0 12px; font-size: 14px; font-weight: 500;
    border-radius: 999px;
  }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chip .n { opacity: .65; font-variant-numeric: tabular-nums; }
  .view { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .order { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
  .order select {
    font: inherit; font-size: 16px; font-weight: 600; color: var(--ink);
    min-height: 36px; padding: 0 32px 0 12px;
    border-radius: 999px; border: 1px solid var(--line); background-color: var(--sheet);
    -webkit-appearance: none; appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%;
    background-size: 5px 5px; background-repeat: no-repeat;
  }
  #foldAll { min-height: 36px; font-size: 14px; font-weight: 500; border-radius: 999px; padding: 0 12px; }

  /* ---------- Sheet ---------- */
  main {
    flex: 1 1 auto; min-height: 0;
    margin: 0 16px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--sheet); box-shadow: var(--shadow);
    overflow: auto; -webkit-overflow-scrolling: touch;
  }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1140px; table-layout: fixed; }
  th, td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 0; }
  th:last-child, td:last-child { border-right: 0; }
  thead th {
    position: sticky; top: 0; z-index: 3;
    background: var(--head); color: var(--head-ink);
    font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em;
    text-align: left; height: 44px; padding: 0 12px;
  }
  th.rn, td.rn {
    width: 48px; text-align: center; color: var(--ink-2);
    background: var(--head); font-size: 13px; font-variant-numeric: tabular-nums;
    position: sticky; left: 0; z-index: 1;
  }
  thead th.rn { z-index: 4; padding: 0; }
  th.act, td.act { width: 56px; text-align: center; }

  tbody tr:not(.day) { scroll-margin-top: 96px; }
  tbody tr.today td:not(.rn) { background: var(--today); }
  tbody tr.late td:not(.rn) { background: var(--late); }
  tbody tr.late td.rn { color: var(--late-ink); font-weight: 700; }
  tbody tr.flash td:not(.rn) { animation: flash 1.4s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent) 25%, transparent); } }

  /* Intestazione del giorno (comprimibile) */
  tr.day td {
    position: sticky; top: 44px; z-index: 2;
    background: var(--day); border-right: 0;
  }
  tr.day.is-today td { background: var(--accent-soft); }
  .day-btn {
    display: block; width: 100%; min-height: 44px; padding: 0;
    border: 0; border-radius: 0; background: transparent; text-align: left;
  }
  .day-btn:active { transform: none; background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .day-btn:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  .day-in {
    position: sticky; left: 0;
    display: inline-flex; align-items: center; gap: 10px;
    min-height: 44px; padding: 0 16px 0 14px;
  }
  .chev {
    display: inline-grid; place-items: center; width: 22px; height: 22px;
    border-radius: 6px; color: var(--ink-2); font-size: 18px; line-height: 1;
    transition: transform .2s cubic-bezier(.2,.8,.2,1);
  }
  .day-btn[aria-expanded="true"] .chev { transform: rotate(90deg); }
  .day-name { font-weight: 700; font-size: 16px; }
  tr.day.is-today .day-name { color: var(--accent); }
  tr.day.is-past .day-name { color: var(--ink-2); }
  .day-rel { color: var(--ink-2); font-weight: 500; font-size: 14px; }
  .pill {
    font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px;
    background: var(--head); color: var(--head-ink); font-variant-numeric: tabular-nums;
  }
  .pill.late { background: var(--late); color: var(--late-ink); }
  .pill.open { background: var(--accent-soft); color: var(--accent); }
  .day-btn:disabled { cursor: default; opacity: 1; }
  .day-btn:disabled .chev { visibility: hidden; }

  td input, td select {
    display: block; width: 100%; height: 48px;
    border: 0; margin: 0; padding: 0 12px;
    background: transparent; color: inherit;
    font: inherit; font-size: 16px; /* 16px evita lo zoom automatico su iOS */
    border-radius: 0; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  td input[type="date"], td input[type="time"] { font-variant-numeric: tabular-nums; }

  /* Celle data + ora affiancate */
  .dt-in { display: flex; }
  .dt-in input { padding: 0 8px; }
  .dt-in input[type="date"] { flex: 1 1 auto; min-width: 0; padding-left: 10px; }
  .dt-in input[type="time"] { flex: 0 0 88px; border-left: 1px dashed var(--line); }
  td.next .na { display: block; padding: 0 12px; line-height: 48px; color: var(--ink-2); opacity: .5; }
  tr:not(.need) td.next .dt-in { display: none; }
  tr.need td.next .na { display: none; }
  /* Esito che richiede una data ma non ancora inserita */
  tr.need:not(.via-next) td.next { outline: 2px dashed var(--accent); outline-offset: -5px; }
  /* La data che decide in quale giorno sta la riga */
  tr.via-next td.next input { color: var(--accent); font-weight: 600; }
  tr.via-next td.first input { color: var(--ink-2); }
  .chip .sw { width: 10px; height: 10px; border-radius: 50%; box-shadow: none; background-color: currentColor; }
  .chip[aria-pressed="true"] .sw { box-shadow: 0 0 0 2px var(--accent-ink); }
  td input::placeholder { color: var(--ink-2); opacity: .45; }
  td:focus-within:not(.rn):not(.act):not([colspan]) { box-shadow: inset 0 0 0 2px var(--focus); position: relative; z-index: 1; }

  td select.esito {
    margin: 8px; height: 32px; width: calc(100% - 16px);
    border-radius: 999px; padding: 0 28px 0 12px;
    font-size: 14px; font-weight: 600;
    background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
    background-position: calc(100% - 15px) 50%, calc(100% - 10px) 50%;
    background-size: 5px 5px; background-repeat: no-repeat;
  }
  .e-none      { background-color: transparent; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line); }
  .e-todo      { background-color: #e3ecfb; color: #1d4b99; }
  .e-callback  { background-color: #fff0d1; color: #8a5300; }
  .e-noanswer  { background-color: #ececec; color: #4a4a4a; }
  .e-appt      { background-color: #e6e1fa; color: #4b3aa0; }
  .e-ok        { background-color: #dcf3e5; color: #17663f; }
  .e-ko        { background-color: #fbe0de; color: #a02a22; }
  @media (prefers-color-scheme: dark) {
    .e-todo     { background-color: #1e2d4a; color: #a9c6ff; }
    .e-callback { background-color: #3d2e10; color: #ffcf7a; }
    .e-noanswer { background-color: #2e2e2e; color: #c8c8c8; }
    .e-appt     { background-color: #2c2650; color: #c6bbff; }
    .e-ok       { background-color: #173927; color: #8fe0b2; }
    .e-ko       { background-color: #47201d; color: #ffaaa3; }
  }

  .del {
    min-height: 40px; width: 40px; padding: 0; justify-content: center;
    border: 0; background: transparent; color: var(--ink-2); font-size: 18px;
  }
  .del:active { color: var(--late-ink); }

  .empty { padding: 48px 24px; text-align: center; color: var(--ink-2); }
  .empty strong { display: block; color: var(--ink); font-size: 18px; margin-bottom: 6px; }

  footer {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    padding: 10px 16px 14px; color: var(--ink-2); font-size: 14px;
  }
  footer b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; border: 1px solid var(--line); }

  /* ---------- Menu & toast ---------- */
  .menu {
    position: fixed; z-index: 20; min-width: 260px;
    background: var(--sheet); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 12px 40px rgba(10,20,40,.18); padding: 6px;
  }
  .menu[hidden] { display: none; }
  .menu button { width: 100%; border: 0; justify-content: flex-start; font-weight: 500; }
  .menu button:hover { background: var(--row-hover); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }
  .menu .note { font-size: 12px; color: var(--ink-2); padding: 6px 12px 8px; line-height: 1.4; }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); z-index: 30;
    transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
    background: var(--ink); color: var(--sheet);
    border-radius: 12px; padding: 8px 8px 8px 16px;
    display: flex; align-items: center; gap: 12px; font-size: 15px;
    transition: opacity .2s ease, transform .2s ease;
    max-width: calc(100vw - 32px);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { min-height: 36px; background: transparent; color: inherit; border-color: color-mix(in srgb, var(--sheet) 35%, transparent); }
  .toast button:empty { display: none; }

  @media (max-width: 600px) {
    h1 { font-size: 18px; width: 100%; }
    main { margin: 0 8px; }
    .filters { padding: 0 8px 10px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Contatti Clienti</h1>
  <input class="search" id="q" type="search" placeholder="Cerca cliente, motivo…" autocomplete="off" aria-label="Cerca">
  <span class="grow"></span>
  <button class="primary" id="add">＋ Nuovo cliente</button>
  <button id="more" aria-haspopup="menu" aria-label="Altre azioni">•••</button>
</header>

<div class="filters">
  <div class="chips" id="chips" role="toolbar" aria-label="Filtra per esito"></div>
  <div class="view">
  <label class="order">Ordina
    <select id="order">
      <option value="vicini">Più vicini a oggi</option>
      <option value="asc">Dal più vecchio</option>
      <option value="desc">Dal più recente</option>
    </select>
  </label>
  <button id="foldAll"></button>
  </div>
</div>

<main id="sheet">
  <table>
    <colgroup>
      <col style="width:44px">
      <col style="width:17%">
      <col style="width:238px">
      <col>
      <col style="width:168px">
      <col style="width:238px">
      <col style="width:52px">
    </colgroup>
    <thead>
      <tr>
        <th class="rn" aria-label="Riga"></th>
        <th>Cliente</th>
        <th>Primo contatto</th>
        <th>Motivo</th>
        <th>Esito</th>
        <th>Richiamo / Appunt.</th>
        <th class="act" aria-label="Azioni"></th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden></div>
</main>

<footer id="stats"></footer>

<div class="menu" id="menu" role="menu" hidden>
  <button role="menuitem" data-act="csv">⬇︎ Esporta per Excel (.csv)</button>
  <button role="menuitem" data-act="json">⬇︎ Backup completo (.json)</button>
  <button role="menuitem" data-act="import">⬆︎ Importa backup o CSV…</button>
  <hr>
  <button role="menuitem" data-act="clear" style="color:var(--late-ink)">Cancella tutti i dati</button>
  <p class="note">I dati sono salvati solo su questo dispositivo. Aggiungi l'app alla schermata Home (Condividi → Aggiungi a Home) e fai un backup ogni tanto.</p>
</div>
<input type="file" id="file" accept=".json,.csv,application/json,text/csv" hidden>

<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastBtn"></button></div>

<script>
(() => {
  'use strict';

  const KEY = 'contatti-clienti:v1';
  const UIKEY = 'contatti-clienti:ui';
  const FIELDS = ['cliente', 'giorno', 'orario', 'motivo', 'esito', 'prossimoGiorno', 'prossimoOrario'];
  const DATE_FIELDS = new Set(['giorno', 'orario', 'prossimoGiorno', 'prossimoOrario']);
  const ESITI = [
    { v: '',                cls: 'e-none',     label: '—' },
    { v: 'Da contattare',   cls: 'e-todo',     label: 'Da contattare' },
    { v: 'Da richiamare',   cls: 'e-callback', label: 'Da richiamare' },
    { v: 'Non risponde',    cls: 'e-noanswer', label: 'Non risponde' },
    { v: 'Appuntamento',    cls: 'e-appt',     label: 'Appuntamento' },
    { v: 'Non interessato', cls: 'e-ko',       label: 'Non interessato' },
  ];
  // Esiti che richiedono una data/ora (richiamo o appuntamento)
  const NEEDS_DATE = new Set(['Da richiamare', 'Appuntamento']);
  // Esiti ancora "da gestire": se la data è passata diventano in ritardo
  const OPEN = new Set(['', 'Da contattare', 'Da richiamare', 'Non risponde']);
  // Nomi delle versioni precedenti
  const RENAMED = { 'Negativo': 'Non interessato', 'Richiamare': 'Da richiamare' };

  const $ = (s) => document.querySelector(s);
  const tbody = $('#rows');

  // ---------- Storage ----------
  let rows = load();
  let saveTimer = null;

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      const data = raw ? JSON.parse(raw) : [];
      return Array.isArray(data) ? data.map(normalize) : [];
    } catch { return []; }
  }
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 250);
  }
  function saveNow() {
    clearTimeout(saveTimer);
    saveTimer = null;
    try { localStorage.setItem(KEY, JSON.stringify(rows)); }
    catch { toast('Impossibile salvare: spazio esaurito o modalità privata.'); }
  }
  // All'uscita salva solo se c'è una modifica in sospeso (non sovrascrive dati di altre schede)
  const flush = () => { if (saveTimer) saveNow(); };
  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
  // App aperta in due schede: tieni allineati i dati
  window.addEventListener('storage', (e) => {
    if (e.key !== KEY || document.activeElement?.closest?.('#rows')) return;
    rows = load(); render();
  });
  // Chiede al browser di non cancellare i dati in automatico
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  // Preferenze di visualizzazione (ordine, giorni compressi)
  let ui = loadUI();
  function loadUI() {
    const def = { order: 'vicini', collapsed: {} };
    try { return Object.assign(def, JSON.parse(localStorage.getItem(UIKEY) || '{}')); } catch { return def; }
  }
  function saveUI() { try { localStorage.setItem(UIKEY, JSON.stringify(ui)); } catch {} }

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  function normalize(r) {
    const o = { id: r.id || uid() };
    for (const f of FIELDS) o[f] = (r[f] ?? '').toString().trim();
    // Versione precedente: nome e cognome erano separati
    if (!o.cliente && (r.nome || r.cognome)) o.cliente = [r.nome, r.cognome].filter(Boolean).join(' ').trim();
    o.esito = RENAMED[o.esito] ?? o.esito;
    o.creato = r.creato || new Date().toISOString();
    o.modificato = r.modificato || o.creato;
    return o;
  }

  // ---------- State ----------
  let filter = 'tutti';
  let query = '';

  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  };
  // Giorno in agenda: la data di richiamo/appuntamento se c'è, altrimenti il primo contatto
  const viaNext = (r) => NEEDS_DATE.has(r.esito) && !!r.prossimoGiorno;
  const effDay = (r) => viaNext(r) ? r.prossimoGiorno : r.giorno;
  const effTime = (r) => viaNext(r) ? r.prossimoOrario : r.orario;
  const slot = (r) => (effDay(r) || '') + '|' + (effTime(r) || '');

  function status(r) {
    const d = effDay(r);
    if (!d || r.esito === 'Non interessato') return '';
    const t = todayStr();
    if (d === t) return 'today';
    if (d < t && OPEN.has(r.esito)) return 'late';
    return '';
  }
  function rowClass(r) {
    return [status(r), NEEDS_DATE.has(r.esito) && 'need', viaNext(r) && 'via-next'].filter(Boolean).join(' ');
  }

  const FILTERS = [{ id: 'tutti', label: 'Tutti', test: () => true }]
    .concat(ESITI.filter(e => e.v).map(e => ({ id: e.v, label: e.label, cls: e.cls, test: r => r.esito === e.v })));

  function filteredRows() {
    const q = query.trim().toLowerCase();
    const f = (FILTERS.find(x => x.id === filter) || FILTERS[0]).test;
    return rows.filter(r => f(r) && (!q || (r.cliente + ' ' + r.motivo + ' ' + r.esito).toLowerCase().includes(q)));
  }

  // ---------- Raggruppamento per giorno ----------
  const byTime = (a, b) => {
    const x = effTime(a) || '', y = effTime(b) || '';
    return (!x) - (!y) || x.localeCompare(y) || a.creato.localeCompare(b.creato);
  };

  function groupRows(list) {
    const map = new Map();
    for (const r of list) {
      const k = effDay(r) || '';
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(r);
    }
    for (const arr of map.values()) arr.sort(byTime);
    const t = todayStr();
    const keys = [...map.keys()].sort((a, b) => {
      if (!a) return -1;                       // "Senza data" sempre in cima: va completata
      if (!b) return 1;
      if (ui.order === 'asc') return a < b ? -1 : 1;
      if (ui.order === 'desc') return a < b ? 1 : -1;
      // Più vicini a oggi: oggi e i prossimi giorni in ordine, poi i giorni passati dal più recente
      const fa = a >= t, fb = b >= t;
      if (fa !== fb) return fa ? -1 : 1;
      return (fa ? 1 : -1) * (a < b ? -1 : 1);
    });
    return keys.map(day => ({ day, rows: map.get(day) }));
  }

  // Compresso? Scelta dell'utente se c'è; altrimenti sono chiusi solo i giorni passati senza nulla da gestire
  function isCollapsed(g) {
    if (query.trim()) return false;
    if (g.day in ui.collapsed) return ui.collapsed[g.day];
    return !!g.day && g.day < todayStr() && g.rows.every(r => !OPEN.has(r.esito));
  }

  const fmt = new Intl.DateTimeFormat('it-IT', { weekday: 'long', day: 'numeric', month: 'long' });
  const fmtY = new Intl.DateTimeFormat('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

  function dayInfo(day) {
    if (!day) return { name: 'Senza data', rel: 'da pianificare', diff: null };
    const [y, m, d] = day.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    const now = new Date(); now.setHours(0, 0, 0, 0);
    const diff = Math.round((date - now) / 864e5);
    const long = cap((y === now.getFullYear() ? fmt : fmtY).format(date));
    const near = { 0: 'Oggi', 1: 'Domani', '-1': 'Ieri' }[diff];
    if (near) return { name: near, rel: long, diff };
    return { name: long, rel: diff > 0 ? `tra ${diff} giorni` : `${-diff} giorni fa`, diff };
  }

  // ---------- Render ----------
  function esitoCls(v) { return (ESITI.find(e => e.v === v) || ESITI[0]).cls; }

  function dayEl(g, collapsed) {
    const info = dayInfo(g.day);
    const late = g.rows.filter(r => status(r) === 'late').length;
    const count = (v) => g.rows.filter(r => r.esito === v).length;
    const calls = count('Da richiamare'), appts = count('Appuntamento');
    const tr = document.createElement('tr');
    tr.className = 'day' + (info.diff === 0 ? ' is-today' : '') + (info.diff < 0 ? ' is-past' : '');
    tr.dataset.day = g.day;
    tr.innerHTML = `<td colspan="7"><button class="day-btn" aria-expanded="${!collapsed}"${query.trim() ? ' disabled' : ''}>
      <span class="day-in">
        <span class="chev" aria-hidden="true">›</span>
        <span class="day-name"></span>
        <span class="day-rel"></span>
        <span class="pill">${g.rows.length} ${g.rows.length === 1 ? 'contatto' : 'contatti'}</span>
        ${calls ? `<span class="pill e-callback">${calls} ${calls === 1 ? 'richiamo' : 'richiami'}</span>` : ''}
        ${appts ? `<span class="pill e-appt">${appts} ${appts === 1 ? 'appuntamento' : 'appuntamenti'}</span>` : ''}
        ${late ? `<span class="pill late">${late} in ritardo</span>` : ''}
      </span></button></td>`;
    tr.querySelector('.day-name').textContent = info.name;
    tr.querySelector('.day-rel').textContent = info.rel;
    return tr;
  }

  function rowEl(r, n) {
    const tr = document.createElement('tr');
    tr.dataset.id = r.id;
    tr.className = rowClass(r);
    tr.innerHTML = `
      <td class="rn">${n}</td>
      <td><input data-f="cliente" autocapitalize="words" autocomplete="off" enterkeyhint="next" placeholder="Nome e cognome"></td>
      <td class="first"><div class="dt-in">
        <input data-f="giorno" type="date" aria-label="Data primo contatto">
        <input data-f="orario" type="time" aria-label="Ora primo contatto">
      </div></td>
      <td><input data-f="motivo" autocapitalize="sentences" autocomplete="off" enterkeyhint="next" placeholder="Motivo del contatto"></td>
      <td><select data-f="esito" class="esito" aria-label="Esito"></select></td>
      <td class="next"><div class="dt-in">
        <input data-f="prossimoGiorno" type="date" aria-label="Data richiamo o appuntamento">
        <input data-f="prossimoOrario" type="time" aria-label="Ora richiamo o appuntamento">
      </div><span class="na">—</span></td>
      <td class="act"><button class="del" aria-label="Elimina riga">✕</button></td>`;
    const sel = tr.querySelector('select');
    for (const e of ESITI) sel.add(new Option(e.label, e.v));
    // Valore non più in elenco (es. "Positivo" di versioni vecchie): mostralo comunque, non perdere il dato
    if (!ESITI.some(e => e.v === r.esito)) sel.add(new Option(r.esito, r.esito));
    for (const f of FIELDS) tr.querySelector(`[data-f="${f}"]`).value = r[f];
    sel.className = 'esito ' + esitoCls(r.esito);
    return tr;
  }

  let groups = [];
  function render() {
    const list = filteredRows();
    groups = groupRows(list);
    const out = [];
    let n = 0;
    for (const g of groups) {
      const c = isCollapsed(g);
      out.push(dayEl(g, c));
      for (const r of g.rows) { n++; if (!c) out.push(rowEl(r, n)); }
    }
    tbody.replaceChildren(...out);
    const empty = $('#empty');
    if (!list.length) {
      empty.hidden = false;
      empty.innerHTML = rows.length
        ? '<strong>Nessun risultato</strong>Prova a cambiare filtro o ricerca.'
        : '<strong>Il foglio è vuoto</strong>Tocca “＋ Nuovo cliente” per aggiungere il primo contatto.';
    } else empty.hidden = true;
    $('#order').value = ui.order;
    const anyOpen = groups.some(g => !isCollapsed(g));
    const fb = $('#foldAll');
    fb.textContent = anyOpen ? 'Comprimi tutti' : 'Espandi tutti';
    fb.disabled = !groups.length || !!query.trim();
    renderFilters();
    renderStats();
  }

  function renderFilters() {
    $('#chips').replaceChildren(...FILTERS.map(f => {
      const b = document.createElement('button');
      b.className = 'chip';
      b.setAttribute('aria-pressed', String(filter === f.id));
      b.innerHTML = `${f.cls ? `<i class="sw ${f.cls}"></i>` : ''}${f.label} <span class="n">${rows.filter(f.test).length}</span>`;
      b.onclick = () => { filter = f.id; render(); };
      return b;
    }));
  }

  function renderStats() {
    const today = rows.filter(r => status(r) === 'today').length;
    const late = rows.filter(r => status(r) === 'late').length;
    $('#stats').innerHTML = `
      <span><b>${rows.length}</b> clienti</span>
      <span><i class="dot" style="background:var(--today)"></i><b>${today}</b> da gestire oggi</span>
      <span><i class="dot" style="background:var(--late)"></i><b>${late}</b> in ritardo</span>
      <span class="grow"></span>
      <span>Salvato su questo dispositivo</span>`;
  }

  function headerOf(tr) {
    let h = tr.previousElementSibling;
    while (h && !h.classList.contains('day')) h = h.previousElementSibling;
    return h;
  }

  // Aggiorna colori, intestazione del giorno e contatori senza ridisegnare la tabella (non perde il focus)
  function refreshRow(tr, r) {
    tr.className = rowClass(r);
    const h = headerOf(tr);
    if (h) {
      const day = h.dataset.day;
      const g = { day, rows: filteredRows().filter(x => (effDay(x) || '') === day && x.id !== r.id).concat(r) };
      h.replaceWith(dayEl(g, false));
    }
    renderFilters();
    renderStats();
  }

  // Ridisegna e mette in evidenza una riga (dopo che si è spostata in un altro giorno)
  function renderAndShow(id, scroll = true) {
    const r = byId(id);
    if (r) { ui.collapsed[effDay(r) || ''] = false; saveUI(); } // il giorno di destinazione si apre
    render();
    const tr = tbody.querySelector(`tr[data-id="${id}"]`);
    if (tr) {
      tr.classList.add('flash');
      if (scroll) tr.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    return tr;
  }

  // ---------- Editing ----------
  const byId = (id) => rows.find(r => r.id === id);
  let moved = null; // riga a cui è cambiata la data in agenda: va riposizionata quando si esce dal campo

  function onEdit(e) {
    const el = e.target, tr = el.closest('tr'), f = el.dataset.f;
    if (!f || !tr) return;
    const r = byId(tr.dataset.id);
    if (!r || r[f] === el.value) return;
    const before = slot(r);
    r[f] = el.value;
    r.modificato = new Date().toISOString();
    save();

    if (f === 'esito') {
      el.className = 'esito ' + esitoCls(el.value);
      const needsDate = NEEDS_DATE.has(r.esito) && !r.prossimoGiorno;
      if (slot(r) !== before) {
        // L'esito sposta la riga in un altro giorno: ridisegna subito
        const row = renderAndShow(r.id);
        if (needsDate) askDate(row);
      } else {
        refreshRow(tr, r);
        if (needsDate) askDate(tr);
      }
      return;
    }
    if (DATE_FIELDS.has(f) && slot(r) !== before) moved = r.id;
    refreshRow(tr, r);
  }
  tbody.addEventListener('input', onEdit);
  tbody.addEventListener('change', onEdit);

  // Dopo "Da richiamare" o "Appuntamento" porta subito sul campo data
  function askDate(tr) {
    const d = tr?.querySelector('[data-f="prossimoGiorno"]');
    if (!d) return;
    d.focus({ preventScroll: true });
    try { d.showPicker(); } catch {}
  }

  tbody.addEventListener('focusout', (e) => {
    if (!moved || !DATE_FIELDS.has(e.target.dataset?.f)) return;
    const id = moved; moved = null;
    const next = e.relatedTarget, nextId = next?.closest?.('tr')?.dataset.id, nextF = next?.dataset?.f;
    renderAndShow(id, !nextId || nextId === id);
    if (nextId && nextF) tbody.querySelector(`tr[data-id="${nextId}"] [data-f="${nextF}"]`)?.focus({ preventScroll: nextId === id });
  });

  // Invio = cella sotto (come Excel). Sull'ultima riga crea un nuovo cliente.
  tbody.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' || e.target.tagName !== 'INPUT') return;
    e.preventDefault();
    const f = e.target.dataset.f;
    let next = e.target.closest('tr').nextElementSibling;
    while (next && next.classList.contains('day')) next = next.nextElementSibling;
    if (next) next.querySelector(`[data-f="${f}"]`).focus();
    else if (f === 'cliente' || f === 'motivo') addRow(f);
    else e.target.blur();
  });

  tbody.addEventListener('click', (e) => {
    const day = e.target.closest('.day-btn');
    if (day) {
      const d = day.closest('tr').dataset.day;
      ui.collapsed[d] = day.getAttribute('aria-expanded') === 'true';
      saveUI(); render();
      return;
    }
    const btn = e.target.closest('.del');
    if (!btn) return;
    const tr = btn.closest('tr');
    const idx = rows.findIndex(r => r.id === tr.dataset.id);
    if (idx < 0) return;
    const [removed] = rows.splice(idx, 1);
    saveNow(); render();
    toast(`${removed.cliente || 'Riga'} eliminato`, 'Annulla', () => {
      rows.splice(Math.min(idx, rows.length), 0, removed);
      saveNow(); render();
    });
  });

  function addRow(focusField = 'cliente') {
    const r = normalize({});
    rows.push(r);
    saveNow();
    filter = 'tutti'; query = ''; $('#q').value = '';
    ui.collapsed[''] = false;
    render();
    const tr = tbody.querySelector(`tr[data-id="${r.id}"]`);
    tr.classList.add('flash');
    tr.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    tr.querySelector(`[data-f="${focusField}"]`).focus({ preventScroll: true });
  }
  $('#add').onclick = () => addRow();

  // Righe completamente vuote non servono: vengono tolte all'apertura e prima di esportare
  function pruneEmpty() {
    const before = rows.length;
    rows = rows.filter(r => FIELDS.some(f => r[f]));
    if (rows.length !== before) saveNow();
  }

  $('#order').addEventListener('change', (e) => { ui.order = e.target.value; saveUI(); render(); });
  $('#foldAll').onclick = () => {
    const collapse = groups.some(g => !isCollapsed(g));
    for (const g of groups) ui.collapsed[g.day] = collapse;
    saveUI(); render();
  };
  $('#q').addEventListener('input', (e) => { query = e.target.value; render(); });

  // ---------- Menu ----------
  const menu = $('#menu');
  $('#more').onclick = (e) => {
    e.stopPropagation();
    if (!menu.hidden) return closeMenu();
    const b = e.currentTarget.getBoundingClientRect();
    menu.hidden = false;
    const w = menu.offsetWidth;
    menu.style.top = (b.bottom + 6) + 'px';
    menu.style.left = Math.max(8, Math.min(b.right - w, innerWidth - w - 8)) + 'px';
  };
  function closeMenu() { menu.hidden = true; }
  document.addEventListener('click', (e) => { if (!menu.contains(e.target)) closeMenu(); });

  menu.addEventListener('click', (e) => {
    const act = e.target.closest('[data-act]')?.dataset.act;
    if (!act) return;
    closeMenu();
    if (act === 'csv') exportCSV();
    if (act === 'json') exportJSON();
    if (act === 'import') $('#file').click();
    if (act === 'clear') clearAll();
  });

  // ---------- Export / Import ----------
  const stamp = () => todayStr();
  // [campo, intestazione nel CSV, altri nomi accettati in importazione]
  const COLS = [
    ['cliente', 'Cliente', ['nome e cognome']],
    ['giorno', 'Primo contatto', ['giorno', 'data']],
    ['orario', 'Ora primo contatto', ['orario', 'ora']],
    ['motivo', 'Motivo', ['motivo del contatto']],
    ['esito', 'Esito', []],
    ['prossimoGiorno', 'Richiamo/Appuntamento', ['richiamo / appuntamento', 'data richiamo']],
    ['prossimoOrario', 'Ora richiamo/appuntamento', ['ora richiamo / appuntamento', 'ora richiamo']],
  ];

  function itDate(iso) { if (!iso) return ''; const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; }
  function isoDate(s) {
    s = (s || '').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    const m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);
    if (!m) return '';
    const y = m[3].length === 2 ? '20' + m[3] : m[3];
    return `${y}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
  }
  function isoTime(s) {
    const t = (s || '').trim().match(/^(\d{1,2})[:.](\d{2})/);
    return t ? `${t[1].padStart(2, '0')}:${t[2]}` : '';
  }

  function exportCSV() {
    pruneEmpty();
    // Punto e virgola + BOM UTF-8: Excel in italiano lo apre già diviso in colonne con gli accenti corretti
    const esc = (v) => /[";\n\r]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
    const lines = [COLS.map(c => c[1]).join(';')];
    const sorted = rows.slice().sort((a, b) => (effDay(a) || '9999').localeCompare(effDay(b) || '9999') || byTime(a, b));
    for (const r of sorted) lines.push(COLS.map(([k]) => esc(k === 'giorno' || k === 'prossimoGiorno' ? itDate(r[k]) : r[k])).join(';'));
    share(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }), `contatti-clienti-${stamp()}.csv`);
  }
  function exportJSON() {
    pruneEmpty();
    const data = { app: 'contatti-clienti', versione: 2, esportato: new Date().toISOString(), righe: rows };
    share(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), `contatti-clienti-backup-${stamp()}.json`);
  }

  async function share(blob, name) {
    const file = new File([blob], name, { type: blob.type });
    // Su iPad il foglio di condivisione permette di salvare in File, inviare via Mail, AirDrop…
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: name }); return; }
      catch (err) { if (err.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }

  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/, 1)[0];
    const sep = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
    const out = []; let row = [], cell = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
        else if (c === '"') q = false;
        else cell += c;
      } else if (c === '"') q = true;
      else if (c === sep) { row.push(cell); cell = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(cell); out.push(row); row = []; cell = '';
      } else cell += c;
    }
    if (cell || row.length) { row.push(cell); out.push(row); }
    if (!out.length) return [];
    const head = out.shift().map(h => h.trim().toLowerCase());
    const col = (names) => head.findIndex(h => names.includes(h));
    const idx = COLS.map(([k, label, alias]) => col([k.toLowerCase(), label.toLowerCase(), ...alias]));
    const iNome = col(['nome']), iCognome = col(['cognome']); // CSV della versione precedente
    return out.filter(r => r.some(c => c.trim())).map(r => {
      const o = {};
      COLS.forEach(([k], j) => { o[k] = idx[j] >= 0 ? (r[idx[j]] || '').trim() : ''; });
      if (!o.cliente) o.cliente = [r[iNome], r[iCognome]].filter(Boolean).join(' ');
      o.giorno = isoDate(o.giorno); o.prossimoGiorno = isoDate(o.prossimoGiorno);
      o.orario = isoTime(o.orario); o.prossimoOrario = isoTime(o.prossimoOrario);
      return normalize(o);
    });
  }

  $('#file').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    e.target.value = '';
    if (!f) return;
    let incoming = [];
    try {
      const text = await f.text();
      if (/\.json$/i.test(f.name) || text.trim().startsWith('{') || text.trim().startsWith('[')) {
        const data = JSON.parse(text);
        incoming = (Array.isArray(data) ? data : data.righe || []).map(normalize);
      } else incoming = parseCSV(text);
    } catch { return toast('File non valido: impossibile leggerlo.'); }
    if (!incoming.length) return toast('Nessuna riga trovata nel file.');
    const ids = new Set(rows.map(r => r.id));
    const fresh = incoming.filter(r => !ids.has(r.id));
    const dup = incoming.length - fresh.length;
    if (!confirm(`Aggiungere ${fresh.length} clienti al foglio?` + (dup ? `\n(${dup} già presenti verranno saltati)` : ''))) return;
    rows.push(...fresh);
    saveNow(); render();
    toast(`${fresh.length} clienti importati`);
  });

  function clearAll() {
    if (!rows.length) return toast('Il foglio è già vuoto.');
    if (!confirm(`Cancellare tutti i ${rows.length} clienti da questo dispositivo?\nConsiglio: prima fai un backup.`)) return;
    const backup = rows;
    rows = []; saveNow(); render();
    toast('Tutti i dati cancellati', 'Annulla', () => { rows = backup; saveNow(); render(); }, 8000);
  }

  // ---------- Toast ----------
  let toastTimer;
  function toast(msg, actLabel = '', act = null, ms = 5000) {
    const t = $('#toast'), b = $('#toastBtn');
    $('#toastMsg').textContent = msg;
    b.textContent = actLabel;
    b.onclick = () => { t.classList.remove('show'); act && act(); };
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), ms);
  }

  // Cambio giorno con l'app aperta: aggiorna Oggi/Domani e le evidenziazioni
  let lastDay = todayStr();
  setInterval(() => {
    if (todayStr() !== lastDay && !document.activeElement?.closest?.('#rows')) { lastDay = todayStr(); render(); }
  }, 60000);

  pruneEmpty();
  if (rows.length) saveNow(); // salva subito i dati convertiti dal formato precedente
  render();

  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
})();
</script>
</body>
</html>
